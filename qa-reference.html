s="eta-est" data-tip="자동으로 수행되는 시간이에요">🕒 ~1시간 30분</span></span></span></div><div class="macro-step"><span class="ms-label"><span class="ms-main">TC 리뷰</span><span class="ms-eta eta-line"><span class="eta-est" data-tip="리뷰에 소비되는 추정 시간이에요">🕒 ~1시간</span></span></span></div><div class="macro-step"><span class="ms-label"><span class="ms-main">E2E 실행<span class="ms-auto-badge" data-tip="AI가 자동으로 수행하는 단계예요">자동</span></span><span class="ms-eta eta-line"><span class="eta-est" data-tip="자동으로 수행되는 시간이에요">🕒 ~2시간 30분</span></span></span></div></div></div><div id="app-body"><!-- 사이드바 --><aside id="sidebar"><div id="sidebar-header"><div class="sb-brand">QA 자동화 스튜디오</div><div class="sb-actions"><button id="sab-home" class="sab-btn" data-tip="프로젝트 선택·새로 만들기·이어하기를 하는 홈 화면으로 돌아가요 (수행 중이면 작업이 취소돼요)">홈</button><button id="sab-reset" class="sab-btn" disabled data-tip="리셋 동작을 점검 중이라 잠시 비활성화했어요.">리셋</button></div></div><!-- 사이드바 프로젝트 목록 (renderSidebarProjects — 현재 프로젝트) --><div id="sidebar-projects"><div class="sb-section"><div class="sb-label"><span>📁 내 프로젝트</span><span class="sb-label-tip" data-tip="전환·생성은 상단 홈에서 해요." tabindex="0">ⓘ</span></div><div class="sb-proj-current" title="예약 취소 플로우 개편">📁 예약 취소 플로우 개편</div></div></div><div id="project-bar" hidden><select id="project-bar-select" hidden><option value="">선택 안 됨</option></select></div><!-- 전문가 도구 (renderSidebar — _전문가 카테고리, 헤더 숨김) --><nav id="skill-nav"><div class="nav-category"><div class="nav-item" data-skill-id="pattern-dashboard" data-tip="E2E에서 학습한 셀렉터·동작 패턴을 보고 관리해요.">패턴 관리</div><div class="nav-item" data-skill-id="install" data-tip="QA 자동화 도구를 최신 버전으로 설치·업데이트해요.">설치/업데이트</div><div class="nav-item" data-skill-id="env-settings" data-tip="테스트 계정·저장소 등 환경 설정을 확인하고 바꿔요.">환경설정</div></div></nav><div id="sidebar-footer"><div id="account-info" class="app-meta-chip" title="qa.lead@example.com">qa.lead@example.com</div><div class="sb-foot-meta"><span id="app-channel" class="hidden"></span><span id="app-version" class="sb-ver">v1.0.19</span></div></div></aside><div id="sidebar-resizer"></div><!-- 메인 영역 --><main id="main-content"><div id="progress-bar-container" class="hidden"><div id="progress-steps"></div><button id="tc-panel-toggle" class="hidden" data-tip="생성된 TC 목록을 열거나 닫아요.">📋</button></div><div id="cli-question-card" class="hidden"><div class="cqc-head"><span class="cqc-icon">❓</span><span id="cqc-question">선택해 주세요</span></div><div id="cqc-options"></div></div><div id="resume-banner" class="hidden"><span class="rb-icon">⏸</span><span class="rb-msg">중단된 작업이 있어요</span><button id="rb-run" class="btn-primary">이어서 실행</button><button id="rb-close" class="btn-icon" title="닫기" data-tip="이어하기 알림을 닫아요. 다음에 다시 표시됩니다.">✕</button></div><div id="error-banner" class="hidden"><span class="eb-icon">⚠️</span><span class="eb-text" id="error-banner-text"></span><button id="error-banner-close" class="btn-icon" title="닫기" data-tip="오류 알림을 닫아요.">✕</button></div><!-- 작업 영역 — 홈(main-home)만 노출, 나머지 동적 패널(hidden)은 이 화면 범위 밖이라 생략 --><div id="workspace"><!-- 홈 (renderHome → tc-gen 단계 '시작 전 안내') --><div id="main-home" class="stretch" style="display:flex;"><div class="stage-intro-wrap"><div class="stage-intro" data-stage="spec"><div class="si-head"><span class="si-h-title">AI 인터뷰</span><span class="si-h-sub">시작 전 안내</span></div><div class="si-section"><div class="si-label">목적</div><div class="si-text">기획 문서를 대화형으로 정리해 요구사항 합의문서를 만듭니다.</div></div><div class="si-section"><div class="si-label">기대 효과</div><ul class="si-list"><li>흩어진 기획·정책·화면 문서를 하나의 요구사항 합의문서로 모아줍니다</li><li>부족한 부분은 AI가 인터뷰 질문으로 채워줘요</li><li>발행된 요구사항 합의문서로 ② TC 생성을 바로 시작할 수 있어요</li></ul></div><div class="si-section"><div class="si-label">진행 흐름</div><div class="si-text">문서 입력(Jira·기획서·Figma) → AI 인터뷰(갭 질문) → 요구사항 합의문서 합성 → Confluence 발행 (답변 속도에 따라 약 30분~1시간)</div></div><div class="si-note">※ 발행되면 Confluence 정식 문서로 공유됩니다.</div><div class="si-ack"><div class="si-ack-title">인터뷰 시작 전 꼭 확인해주세요</div><div class="si-ack-intro">AI가 답변을 학습해 다음 질문과 테스트케이스(TC)를 만들어요. 답변 하나가 결과 품질을 좌우해요.</div><table class="si-ack-table"><thead><tr><th>상황</th><th>이렇게 하세요</th></tr></thead><tbody><tr><td class="si-ack-situation">잘 모르는 질문</td><td class="si-ack-how"><span class="si-ack-act">건너뛰기</span><span class="si-ack-desc"> — 틀린 답변은 잘못된 TC로 이어져요</span></td></tr><tr><td class="si-ack-situation">제외할 기능</td><td class="si-ack-how"><span class="si-ack-act">스펙아웃</span><span class="si-ack-desc"> — 이후 해당 기능은 질문하지 않아요</span></td></tr><tr><td class="si-ack-situation">답변을 고치고 싶을 때</td><td class="si-ack-how"><span class="si-ack-act">초기화</span><span class="si-ack-desc"> — ⚠️ 하위 답변까지 모두 초기화돼요</span></td></tr></tbody></table><label class="si-ack-item"><input type="checkbox" class="si-ack-cb"><span>위 내용을 확인했어요</span></label></div><button class="si-start" disabled>AI 인터뷰 시작하기</button></div></div></div></div><div id="ask-bar" style="display:none;"><input id="ask-input" type="text" autocomplete="off" placeholder="무엇이든 물어보세요 (Enter)" data-tip="자연어로 질문/요청하면 오른쪽 claude CLI로 전달돼 실행돼요."><button id="ask-send" title="보내기" data-tip="claude CLI로 보내기 (Enter)">전송</button></div></main><div id="cli-resizer"></div><button id="cli-pane-toggle" data-tip="단계 현황을 접거나 펼쳐요.">›</button><!-- 오른쪽 col-3 (상시 노출) — 단계 sub-view --><aside id="cli-pane"><div id="cli-side-view"><div id="cli-side-header"><span>미리보기</span></div><div id="cli-side-content"><div><div class="col3-body"><div class="si-mini"><div class="si-mini-icon">⚙️</div><div class="si-mini-title">TC 생성</div><div class="si-mini-text">정리된 요구사항을 AI가 분석해서 TC를 자동으로 만듭니다.</div></div></div></div></div></div><!-- claude CLI 터미널 — 하단 드로어(기본 오프스크린) --><div id="terminal-container"><div id="term-resizer" data-tip="위아래로 드래그해 콘솔 높이를 조절해요."></div><div id="terminal-header"><span data-tip="claude CLI 콘솔이에요. 모든 작업이 여기서 실행되고 로그가 실시간으로 보여요.">⌘ claude CLI</span><span id="terminal-account" class="term-account" data-tip="현재 로그인된 Claude Code 계정이에요. 토큰(비용)이 이 계정에서 차감돼요.">👤 qa.lead@example.com</span><div id="terminal-actions"><button id="btn-kill" class="btn-icon" data-tip="지금 실행 중인 작업만 멈춰요. claude 세션은 유지돼요. (Ctrl+C)" disabled>■ 중단</button><button id="btn-clear" class="btn-icon" data-tip="화면을 비우고 claude 세션을 새로 시작해요. (Cmd+K)">⌫ 새 세션</button><button id="cli-collapse" class="btn-icon" title="단계 보기로" data-tip="터미널을 닫고 단계 안내로 돌아가요.">▾</button></div></div><div id="terminal"></div></div></aside></div><!-- /app-body --><!-- 전역 버전 배지 (좌하단 상시 노출, position:fixed) — stable 채널은 라벨 생략되어 버전만 표기 --><div id="app-version-badge" class="app-meta-chip" title="앱 버전 v1.0.19">v1.0.19</div></div></script><script type="text/html" id="tpl-ov-gate"><div id="welcome-overlay"><div id="welcome-box" data-auth="required"><div id="welcome-logo">🤖</div><h1 id="welcome-title">QA 자동화 스튜디오</h1><p id="welcome-sub">요구사항 분석부터 테스트 실행까지, AI가 함께해요.</p><div id="welcome-token-notice">QA 자동화 스튜디오는 Claude를 기반으로 작동합니다.<br>작업에 소모되는 <b>토큰(비용)은 사용자의 계정에서 차감</b>됩니다.</div><div id="welcome-gcp"><div class="welcome-gcp-line"><span class="auth-dot"></span><span id="welcome-gcp-text">Google 로그인이 필요해요</span></div><button id="welcome-gcp-btn" data-tip="회사 Google 계정으로 로그인해요. 브라우저에 로그인 페이지가 열립니다.">Google 로그인</button><div id="welcome-gcp-note">Google 인증이 만료되면 이 화면이 다시 보여요.</div><div id="welcome-gcp-guide"><div class="guide-empty"><div class="guide-icon">🔑</div><div class="guide-title">Google 인증 권한이 없나요?</div><div class="guide-body">사내 시스템에 접근하려면 **회사 Google 계정 인증이 필요해요.**
로그인이 막혔다면 아래 **슬랙으로 문의하기** 버튼으로 권한을 요청해 주세요.</div><button class="guide-action" data-tip="GCP 인증 권한 요청 채널로 이동해요">슬랙으로 문의하기</button></div></div><div id="welcome-setup"><button id="welcome-install-btn" class="sab-btn" data-tip="install.sh를 실행해 에이전트·MCP·자동업데이트를 설치/갱신해요. (GCP 로그인 전에도 가능)">🔧 환경 설치 / 업데이트</button><div id="welcome-install-status"></div></div></div></div></div></script>
<script type="text/html" id="tpl-ov-choice"><div id="welcome-overlay"><div id="welcome-box" data-auth="ok"><div id="welcome-logo">🤖</div><h1 id="welcome-title">QA 자동화 스튜디오</h1><p id="welcome-sub">요구사항 분석부터 테스트 실행까지, AI가 함께해요.</p><div id="welcome-token-notice">QA 자동화 스튜디오는 Claude를 기반으로 작동합니다.<br>작업에 소모되는 <b>토큰(비용)은 사용자의 계정에서 차감</b>됩니다.</div><div id="welcome-actions"><div id="welcome-choice-view"><div class="welcome-choice ready"><button class="wc-card primary" id="wc-new" data-tip="새 프로젝트 - 문서 입력부터 시작"><div class="wc-title">새로 시작하기</div><div class="wc-desc">프로젝트 문서를 입력하면<br>AI 인터뷰가 시작됩니다.</div></button><button class="wc-card" id="wc-resume" data-tip="이전 프로젝트로 이어서 진행"><div class="wc-title">이어하기</div><div class="wc-desc">이전에 작업했던 프로젝트를<br>이어서 진행합니다.</div></button></div><div id="welcome-choice-loading" class="welcome-choice-loading" aria-hidden="true"><span class="wcl-dot"></span><span class="wcl-dot"></span><span class="wcl-dot"></span></div><div id="welcome-firsttime-hint" class="welcome-hint"><b>처음이신가요?</b> 새로 시작하기를 누르면 단계별 안내가 함께 진행됩니다.</div><div id="welcome-choice-setup"><button id="welcome-choice-install-btn" class="sab-btn" data-tip="install.sh를 실행해 에이전트·MCP·자동업데이트를 설치/갱신해요.">🔧 환경 설치 / 업데이트</button><div id="welcome-choice-install-status"></div></div><div class="welcome-guide"><div class="wg-head">사용 가이드</div><details class="wg-item" open><summary><span class="wg-q">이 도구는 무엇을 하나요?</span><span class="wg-arrow">▾</span></summary><div class="wg-body"><p>AI가 요구사항 분석부터 TC 생성 및 테스트 실행까지 할 수 있도록 도와줍니다.</p><ul class="wg-compare"><li><b>요구사항 분석 → TC 자동 생성 → 테스트 자동 실행 → 결과 확인</b></li></ul></div></details><details class="wg-item"><summary><span class="wg-q">진행 순서는 어떻게 되나요?</span><span class="wg-arrow">▾</span></summary><div class="wg-body"><ol class="wg-steps"><li><b>AI 인터뷰</b> - TC 생성에 필요한 요구사항을 AI와 대화로 정리합니다.</li><li><b>TC 생성</b> - 정리된 요구사항을 바탕으로 AI가 TC를 자동으로 만듭니다.</li><li><b>TC 리뷰</b> - 만들어진 TC를 한 건씩 검토합니다. 승인하면 다음 단계로 넘어가요.</li><li><b>E2E 실행</b> - AI가 테스트를 자동으로 수행하고 사용자가 결과를 확인합니다.</li></ol><p class="wg-note">이전 단계가 끝나야 다음 단계가 열립니다.</p></div></details><details class="wg-item"><summary><span class="wg-q">시작 전에 무엇이 필요한가요?</span><span class="wg-arrow">▾</span></summary><div class="wg-body"><div class="wg-req-list"><div class="wg-req-group"><div class="wg-req-group-title">필수</div><div class="wg-req"><b>에픽 티켓</b> - QA 스페이스 에픽 (전체 링크 붙여넣기)</div><div class="wg-req"><b>기획 정책 문서</b></div></div><div class="wg-req-group"><div class="wg-req-group-title">권장</div><div class="wg-req"><b>Figma 디자인</b></div><div class="wg-req"><b>개발 스펙</b></div><div class="wg-req"><b>API 명세</b> (Swagger 등)</div></div></div><p class="wg-note">권장 문서를 더 넣을수록 추천 답변 품질이 좋아지고 질문이 줄어듭니다.</p></div></details><details class="wg-item"><summary><span class="wg-q">자주 묻는 질문</span><span class="wg-arrow">▾</span></summary><div class="wg-body"><div class="wg-faq"><div class="wg-faq-step">① AI 인터뷰 (명세)</div><div class="wg-faq-q">Q. 보기에 원하는 답이 없으면 어떻게 하나요?</div><div class="wg-faq-a">A. 하단 입력란에 직접 적고 전송 버튼을 누르세요.</div><div class="wg-faq-q">Q. 확정한 답변을 수정할 수 있나요?</div><div class="wg-faq-a">A. 일관성을 위해 확정 후에는 일부 수정이 어려워요. 확정 전이라면 <b>답변 재작성</b>으로 다시 입력할 수 있습니다.</div><div class="wg-faq-q">Q. 준비(문서 수집·분석)가 오래 걸려요.</div><div class="wg-faq-a">A. 문서 양에 따라 수 분 걸릴 수 있어요. 끝나면 사이드바 '준비'가 초록 ✔로 바뀌고 질문이 시작됩니다. 너무 오래 멈춰 있으면 앱을 재시작한 뒤 <b>이어하기</b>로 멈춘 지점부터 다시 시작하세요.</div><div class="wg-faq-q">Q. 사이드바 단계(준비·T1~T3)를 접을 수 있나요?</div><div class="wg-faq-a">A. 각 그룹 헤더를 클릭하면 접기/펴기 됩니다.</div><div class="wg-faq-step">② TC 생성</div><div class="wg-faq-q">Q. 얼마나 걸리나요?</div><div class="wg-faq-a">A. 보통 40분 안팎(문서·요구사항 양에 따라). 진행 상황은 화면에 단계별로 표시됩니다.</div><div class="wg-faq-q">Q. "AI가 작업을 진행하고 있어요"에서 오래 안 바뀌어요.</div><div class="wg-faq-a">A. 화면의 진행 표시는 백그라운드에서 도는 AI 작업을 분석해 보여주는 거예요. 3분 넘게 진행이 없으면 <b>안내 창</b>이 뜨는데, 거기서 <b>재시작</b>을 눌러 다시 시도하세요.</div><div class="wg-faq-q">Q. 생성 중에 멈출 수 있나요?</div><div class="wg-faq-a">A. 진행 화면의 <b>중단</b> 버튼으로 멈출 수 있어요.</div><div class="wg-faq-step">③ TC 리뷰</div><div class="wg-faq-q">Q. 일부만 승인하고 확정할 수 있나요?</div><div class="wg-faq-a">A. 아니요. <b>전부 승인</b>해야 확정 버튼이 활성화됩니다(미승인이 있으면 차단).</div><div class="wg-faq-q">Q. TC 내용을 직접 고칠 수 있나요?</div><div class="wg-faq-a">A. 각 TC의 <b>수정</b>으로 제목·스텝·기대결과를 고치고, <b>추가</b>도 됩니다.</div><div class="wg-faq-q">Q. 확정하면 되돌릴 수 있나요?</div><div class="wg-faq-a">A. 확정은 되돌릴 수 없어요(Zephyr 업로드 + 읽기전용 잠금). 수정하려면 <b>② TC 생성부터 다시</b> 만들어야 합니다.</div><div class="wg-faq-step">④ E2E 실행</div><div class="wg-faq-q">Q. E2E를 바로 실행할 수 있나요?</div><div class="wg-faq-a">A. <b>③ TC 리뷰를 확정</b>해야 실행할 수 있어요(확정된 TC가 필요).</div><div class="wg-faq-q">Q. 이전 실행 결과를 다시 볼 수 있나요?</div><div class="wg-faq-a">A. 네, 진입 시 <b>이전 결과 보기</b> 또는 <b>재실행</b>을 고를 수 있어요.</div><div class="wg-faq-q">Q. 웹·모바일 중 무엇이 실행되나요?</div><div class="wg-faq-a">A. 실행 시 테스트 유형(웹 Playwright / 모바일 Android·iOS)을 물어봐요.</div><div class="wg-faq-step">공통</div><div class="wg-faq-q">Q. 진행 중 다른 프로젝트로 바꾸면 어떻게 되나요?</div><div class="wg-faq-a">A. 진행 중이던 작업은 취소돼요(경고가 떠요). 나중에 <b>이어하기</b>로 멈춘 지점부터 복원할 수 있어요.</div><div class="wg-faq-q">Q. 앱을 껐다 켜면 이어서 할 수 있나요?</div><div class="wg-faq-a">A. 네, <b>이어하기</b>에서 멈춘 지점부터 복원됩니다.</div><div class="wg-faq-q">Q. 화면이 멈춘 것 같아요.</div><div class="wg-faq-a">A. 진행이 멈추면 보통 <b>안내 창이나 경과 표시</b>가 떠요(백그라운드 AI 작업을 분석해 보여줍니다). 안내 창의 <b>재시작</b>을 누르면 다시 진행됩니다.</div></div></div></details></div></div></div></div></div></script>
<script type="text/html" id="tpl-ov-resume"><div id="welcome-overlay"><div id="welcome-box" data-auth="ok"><div id="welcome-logo">🤖</div><h1 id="welcome-title">QA 자동화 스튜디오</h1><p id="welcome-sub">요구사항 분석부터 테스트 실행까지, AI가 함께해요.</p><div id="welcome-token-notice">QA 자동화 스튜디오는 Claude를 기반으로 작동합니다.<br>작업에 소모되는 <b>토큰(비용)은 사용자의 계정에서 차감</b>됩니다.</div><div id="welcome-actions"><div id="welcome-resume-view"><div class="recent-head"><div id="welcome-recent-label" class="label">이어서 진행할 프로젝트를 골라요</div></div><div class="recent-search"><span class="si">🔍</span><input id="welcome-recent-search" type="text" autocomplete="off" placeholder="프로젝트 이름 검색…"></div><div id="welcome-recent-filter" class="recent-filter-chips" role="group" aria-label="상태 필터"><button type="button" class="recent-filter-arrow recent-filter-arrow-left hidden" aria-label="이전 상태">‹</button><div class="recent-filter-strip"><button type="button" class="recent-filter-chip is-active" aria-pressed="true">전체 (4)</button><button type="button" class="recent-filter-chip" aria-pressed="false">시작 전 (0)</button><button type="button" class="recent-filter-chip" aria-pressed="false">AI 인터뷰 (1)</button><button type="button" class="recent-filter-chip" aria-pressed="false">TC 생성 (1)</button><button type="button" class="recent-filter-chip" aria-pressed="false">TC 리뷰 (1)</button><button type="button" class="recent-filter-chip" aria-pressed="false">E2E 실행 (1)</button></div><button type="button" class="recent-filter-arrow recent-filter-arrow-right hidden" aria-label="다음 상태">›</button></div><div id="welcome-recent-count" class="recent-count">4개 프로젝트</div><div id="welcome-recent-grid" class="recent-list"><button class="recent-card"><span class="jira-key">DEMO-2041</span><div class="rc-mid"><div class="rc-name">예약 취소 플로우 개편</div><div class="rc-meta">2026.07.20 09:40 생성 · <span class="rc-status rc-status-spec" data-tip="AI 인터뷰 · 요구사항 정리 중">AI 인터뷰</span></div></div><span class="rc-go">선택</span></button><button class="recent-card"><span class="jira-key">DEMO-1988</span><div class="rc-mid"><div class="rc-name">지도 마커 클러스터링</div><div class="rc-meta">2026.07.17 10:31 생성 · <span class="rc-status rc-status-review" data-tip="TC 리뷰 · 리뷰 중">TC 리뷰</span></div></div><span class="rc-go">선택</span></button><button class="recent-card"><span class="jira-key">DEMO-1955</span><div class="rc-mid"><div class="rc-name">블랙라벨 결제 수단 추가</div><div class="rc-meta">2026.07.15 17:40 생성 · <span class="rc-status rc-status-gen" data-tip="TC 생성 · 시나리오 작성 · 3/8">TC 생성</span></div></div><span class="rc-go">선택</span></button><button class="recent-card"><span class="jira-key">DEMO-1902</span><div class="rc-mid"><div class="rc-name">쿠폰함 정렬 규칙 변경</div><div class="rc-meta">2026.07.10 11:05 생성 · <span class="rc-status rc-status-e2e" data-tip="E2E 실행 · 5/12">E2E 실행</span></div></div><span class="rc-go">선택</span></button></div><div id="welcome-resume-footer"><button id="wc-back" class="wc-back">뒤로</button><button id="wc-proceed" class="btn-primary" disabled>프로젝트 진행</button></div></div></div></div></div></script>
<script type="text/html" id="tpl-newproj"><div id="input-form-native-panel"><div id="input-form-header"><button class="wd-back" id="input-form-back" type="button">← 뒤로</button><span id="input-form-title">프로젝트 정보 입력</span><span class="input-form-spacer"></span><div id="spec-form-install-setup"><button class="sab-btn" id="spec-form-install-btn" type="button" data-tip="install.sh를 실행해 에이전트·MCP·자동업데이트를 설치/갱신해요.">🔧 환경 설치 / 업데이트</button><div id="spec-form-install-status"></div></div><button id="input-form-close" class="btn-icon" data-tip="입력 폼 패널을 닫아요.">✕</button></div><div id="input-form-fields"><div class="ifv2"><!-- 진행 레일 (renderRail) — STEP 1 부터 시작 --><div class="rail" id="ifv2-rail"><div class="rnode active"><span class="rdot">1</span><span class="rlbl">프로젝트</span></div><span class="rline"></span><div class="rnode"><span class="rdot">2</span><span class="rlbl">서비스 카테고리</span></div><span class="rline"></span><div class="rnode"><span class="rdot">3</span><span class="rlbl">QA 에픽</span></div><span class="rline"></span><div class="rnode"><span class="rdot">4</span><span class="rlbl">기획 문서</span></div><span class="rline"></span><div class="rnode"><span class="rdot">＋</span><span class="rlbl">선택 문서</span></div></div><!-- 본문 (renderReqPhase) --><div class="ifv2-body" id="ifv2-body"><div class="ifv2-intro">📋 <b>프로젝트 정보와 참고 문서</b>를 하나씩 넣어주세요. 문서가 많을수록 <b>추천 답변 품질</b>이 좋아지고 <b>인터뷰 질문이 줄어들어요.</b></div><!-- STEP 1 활성 카드: 프로젝트명 --><div class="active-card" data-doc-step="name"><div class="ac-step">STEP 1 · 프로젝트</div><div class="ac-q">프로젝트 이름을 알려주세요<span class="req">*</span></div><div class="ac-help">TC·리포트·Jira에서 이 이름으로 프로젝트를 구분해요.</div><input class="ac-in" type="text" value="예약 취소 플로우 개편" autocomplete="off"><div class="ac-actions"><button class="ac-next" type="button">다음 →</button><span class="ac-enter"><kbd>Enter</kbd> 로 다음</span></div></div><!-- 다음 단계 미리보기 --><div class="upnext" id="doc-upnext"><span class="un-n">2</span>다음: 요구사항 합의문서를 어디에 저장할까요? (서비스 카테고리)</div></div><!-- 하단 foot (buildFoot) --><div class="ifv2-foot"><span class="ifv2-foot-status" id="spec-form-status">필수 0/4 입력됨 — 프로젝트 단계</span><button class="ifv2-start" id="spec-form-start" type="button" disabled>AI 인터뷰 시작</button></div></div></div></div></script>
<script type="text/html" id="tpl-editmodal"><div id="tc-edit-modal-root"><div class="modal-back show"><div class="modal"><!-- 헤더 --><div class="m-head"><span class="m-mode fix">✎ TC 수정</span><span class="m-id">TC-CANCEL-EDGE-004</span><span class="m-dom" style="display:none"></span><span class="m-auto" style="display:none">자동 생성</span><span class="m-q skeleton" style="color:var(--red);background:var(--red-soft);">🔴 미완성 TC</span><button class="m-x">✕</button></div><!-- 본문 --><div class="m-body"><div class="m-tip" style="display:none"></div><!-- 🛠 보완 필요 (marker + placeholder step → 노출·펼침) --><div class="m-sec" data-open="1"><div class="m-sec-h collapsible">🛠 보완 필요<span class="m-sec-cnt"></span><span class="m-sec-caret">접기 ▾</span></div><div class="m-sec-b"><div class="m-boost-reason"><div class="m-boost-reason-lab">왜 보완이 필요한가요</div><div class="m-boost-reason-text">기대결과가 비어 있어 합격/불합격을 판정할 수 없어요 — 재취소 안내 문구·버튼 상태를 채워야 해요.</div><div class="m-boost-reason-mark">⚠ 근거 미확정 — 아래 「🔎 근거 확증」에 직접 확인한 사실을 입력하면 승인을 진행할 수 있어요</div></div><div class="m-field m-attest"><label>🔎 근거 확증 <span style="font-weight:500;color:var(--text-muted)">(직접 확인한 내용 — 저장 시 함께 접수 · 비우면 전송 안 함)</span></label><div class="m-attest-subhint">이미 취소된 예약 재취소 시 노출 문구를 어떻게 하면 될지 입력해주세요.</div><input class="m-in m-attest-content" value="" placeholder="" data-tip="확인된 사실 — 명세(PRD·Figma·기획)에서 직접 확인한 내용을 적어주세요"><input class="m-in m-attest-actor" value="qa.lead@example.com" placeholder="확인자 (예: 이메일)" data-tip="누가 확인했는지 — 앱 로그인 계정으로 자동 채움(수정 가능)"></div></div></div><!-- 📋 기본 정보 --><div class="m-sec"><div class="m-sec-h">📋 기본 정보</div><div class="m-sec-b"><div class="m-field"><label>TC 제목</label><input class="m-in" id="m-title" value="이미 취소된 예약을 재취소 시도 시 '이미 취소됨' 안내 노출 확인" placeholder=""></div><div class="m-field" style="display:none"><label>그룹 <span style="font-weight:500;color:var(--text-muted)">(내용에 맞는 그룹을 자동 제안 · 직접 바꿀 수 있어요)</span></label><select class="m-in"></select><div class="m-grp-suggest" style="display:none"></di ="c3-reflink-row"><span class="c3-reflink-dot">•</span><a class="c3-reflink-a" href="#" title="https://jira.example.com/browse/DEMO-2041">DEMO-2041 예약 취소 플로우 개편</a></div></li></ul></div><div class="c3-reflink-group"><button type="button" class="c3-reflink-group-head"><span class="c3-reflink-group-toggle">▼</span><span class="c3-reflink-group-name">📄 Confluence</span><span class="c3-reflink-group-count">1</span></button><ul class="c3-reflink-list c3-reflink-root"><li class="c3-reflink-item"><div class="c3-reflink-row"><span class="c3-reflink-dot">•</span><a class="c3-reflink-a" href="#" title="https://jira.example.com/wiki/spaces/PLAN/pages/reservation-cancel">기획 정책 문서</a></div></li></ul></div><div class="c3-reflink-group"><button type="button" class="c3-reflink-group-head"><span class="c3-reflink-group-toggle">▼</span><span class="c3-reflink-group-name">🎨 Figma</span><span class="c3-reflink-group-count">1</span></button><ul class="c3-reflink-list c3-reflink-root"><li class="c3-reflink-item"><div class="c3-reflink-row"><span class="c3-reflink-dot">•</span><a class="c3-reflink-a" href="#" title="https://figma.com/file/reservation-cancel-v3">예약 취소 개편 v3</a></div></li></ul></div><div class="c3-reflink-group"><button type="button" class="c3-reflink-group-head"><span class="c3-reflink-group-toggle">▼</span><span class="c3-reflink-group-name">🛠️ 개발 스펙</span><span class="c3-reflink-group-count">1</span></button><ul class="c3-reflink-list c3-reflink-root"><li class="c3-reflink-item"><div class="c3-reflink-row"><span class="c3-reflink-dot">•</span><a class="c3-reflink-a" href="#" title="https://jira.example.com/wiki/spaces/DEV/pages/cancel-api-spec">개발 스펙 문서</a></div></li></ul></div></div></div><div class="c3-spec-tabpanel active" data-tier="T1"><div class="c3-spec-doc c3-changes-doc"><div class="tsn-sec"><div class="tsn-sec-title">용어 정의</div><ul class="tsn-list"><li class="tsn-unit"><div class="tsn-q">❓ 문서마다 '취소'와 '환불'이 혼용돼요. '예약 취소'의 정의를 무엇 기준으로 통일할까요?</div><div class="tsn-line tsn-a"><span class="tsn-k">답변</span><span class="tsn-v">결제 취소(승인 취소)와 환불을 구분해 정의</span></div><div class="tsn-line tsn-asis"><span class="tsn-k">이전</span><span class="tsn-v"><s>(기존 명세 미정의)</s></span></div><div class="tsn-line tsn-tobe"><span class="tsn-k">변경</span><span class="tsn-v"><b>'예약 취소' = 예약 상태를 CANCELED로 전환 + 결제 승인 취소. 환불은 별도 수수료 정책으로 분리한다.</b></span></div></li></ul></div><div class="tsn-sec"><div class="tsn-sec-title">개요·배경</div><ul class="tsn-list"><li class="tsn-unit"><div class="tsn-q">❓ 이번 개편에서 '예약 취소'를 다시 정의하는 핵심 목적은?</div><div class="tsn-line tsn-a"><span class="tsn-k">답변</span><span class="tsn-v">환불 규정과 취소 플로우의 불일치를 해소하기 위해</span></div><div class="tsn-line tsn-asis"><span class="tsn-k">이전</span><span class="tsn-v"><s>취소 시 환불 규정이 화면마다 달라 CS 문의가 잦았다</s></span></div><div class="tsn-line tsn-tobe"><span class="tsn-k">변경</span><span class="tsn-v"><b>취소=상태 전환, 환불=수수료 정책을 단일화해 화면 간 일관성을 확보한다.</b></span></div></li></ul></div><div class="tsn-sec"><div class="tsn-sec-title">기획 및 정책</div><ul class="tsn-list"><li class="tsn-unit"><div class="tsn-q">❓ 예약 시작 몇 시간 전까지 무료 취소를 허용하나요?</div><div class="tsn-line tsn-a"><span class="tsn-k">답변</span><span class="tsn-v">이용 24시간 전까지 무료 취소</span></div><div class="tsn-line tsn-asis"><span class="tsn-k">이전</span><span class="tsn-v"><s>(기존 명세 미정의)</s></span></div><div class="tsn-line tsn-tobe"><span class="tsn-k">변경</span><span class="tsn-v"><b>이용 시작 24시간 이전 취소는 수수료 0원, 이후 구간별 수수료를 부과한다.</b></span></div></li></ul></div></div></div><div class="c3-spec-tabpanel" data-tier="T2"><div class="c3-spec-doc c3-changes-doc"><div class="tsn-sec"><div class="tsn-sec-title">사용자 시나리오·정상 흐름</div><ul class="tsn-list"><li class="tsn-unit"><div class="tsn-q">❓ 사용자가 예약 취소를 시작하는 주요 진입점은?</div><div class="tsn-line tsn-a"><span class="tsn-k">답변</span><span class="tsn-v">예약 상세 화면의 취소 버튼</span></div><div class="tsn-line tsn-asis"><span class="tsn-k">이전</span><span class="tsn-v"><s>(기존 명세 미정의)</s></span></div><div class="tsn-line tsn-tobe"><span class="tsn-k">변경</span><span class="tsn-v"><b>예약 상세 &gt; '예약 취소' &gt; 확인 모달 &gt; 취소 완료 토스트 순으로 진행한다.</b></span></div></li></ul></div><div class="tsn-sec"><div class="tsn-sec-title">예외 처리</div><ul class="tsn-list"><li class="tsn-unit"><div class="tsn-q">❓ 취소 API가 실패(500)하면 사용자에게 무엇을 노출하나요?</div><div class="tsn-line tsn-a"><span class="tsn-k">답변</span><span class="tsn-v">재시도 안내 토스트와 재시도 버튼</span></div><div class="tsn-line tsn-asis"><span class="tsn-k">이전</span><span class="tsn-v"><s>실패 시 빈 화면 노출</s></span></div><div class="tsn-line tsn-tobe"><span class="tsn-k">변경</span><span class="tsn-v"><b>'잠시 후 다시 시도해 주세요' 토스트 + 재시도 버튼을 노출하고 예약 상태는 유지한다.</b></span></div></li></ul></div><div class="tsn-sec"><div class="tsn-sec-title">경계값·입력 제약</div><ul class="tsn-list"><li class="tsn-unit"><div class="tsn-q">❓ 이미 취소된 예약을 다시 취소 시도하면?</div><div class="tsn-line tsn-a"><span class="tsn-k">답변</span><span class="tsn-v">'이미 취소된 예약' 안내 노출</span></div><div class="tsn-line tsn-asis"><span class="tsn-k">이전</span><span class="tsn-v"><s>(기존 명세 미정의)</s></span></div><div class="tsn-line tsn-tobe"><span class="tsn-k">변경</span><span class="tsn-v"><b>재취소 요청 시 서버 오류 대신 '이미 취소된 예약이에요' 안내를 노출한다.</b></span></div></li></ul></div></div></div><div class="c3-spec-tabpanel" data-tier="T3"><div class="c3-spec-doc c3-changes-doc"><div class="tsn-sec"><div class="tsn-sec-title">화면 및 UI 명세</div><ul class="tsn-list"><li class="tsn-unit"><div class="tsn-q">❓ 취소 확인 모달의 기본(파괴적) 버튼 라벨은?</div><div class="tsn-line tsn-a"><span class="tsn-k">답변</span><span class="tsn-v">'취소하기' — 파괴적 액션을 명확히</span></div><div class="tsn-line tsn-asis"><span class="tsn-k">이전</span><span class="tsn-v"><s>'확인'</s></span></div><div class="tsn-line tsn-tobe"><span class="tsn-k">변경</span><span class="tsn-v"><b>확인 모달 기본 버튼은 '취소하기'(파괴적 강조), 보조 버튼은 '닫기'로 노출한다.</b></span></div></li></ul></div><div class="c3-changes-empty">개발 스펙 · API 및 데이터 명세는 아직 확정 전이에요.</div></div></div></div></div></script>

div class="spec-msg spec-msg-team-lead spec-greet"><div class="spec-greet-hello">환영합니다. AI 인터뷰를 시작할게요.</div><div class="spec-greet-card"><div class="spec-greet-row"><span class="spec-greet-label">프로젝트</span><span class="spec-greet-value">예약 취소 플로우 개편</span></div><div class="spec-greet-row"><span class="spec-greet-label">참고 문서 3건</span><span class="spec-greet-chips"><span class="spec-greet-chip">기획 정책 문서</span><span class="spec-greet-chip">Figma 디자인</span><span class="spec-greet-chip">개발 스펙 문서</span></span></div></div><div class="spec-greet-wait">제출하신 문서를 수집·분석한 뒤 인터뷰가 시작돼요 (약 15분)</div></div><div class="spec-msg spec-msg-status">✓ 개요·정책 3개 항목 확정 · 11분 05초</div><div class="spec-msg spec-msg-status">✓ 요구사항 정의 4개 항목 확정 · 14분 30초</div><div class="spec-msg spec-msg-team-lead spec-card-done" data-section-id="8"><div class="spec-q-meta"><div class="spec-q-ic">📋</div><div class="spec-q-meta-txt"><div class="spec-q-sec">화면 및 UI 명세</div><div class="spec-q-prog">질문 1 / 1</div></div></div><div class="spec-q-body">취소 확인 모달의 기본(파괴적) 버튼 라벨을 무엇으로 노출할까요?</div><div class="spec-q-options answered editable"><button type="button" class="spec-q-option chosen">1. '취소하기' — 파괴적 액션을 명확히</button><button type="button" class="spec-q-option">2. '예약 취소' — 대상 명시</button><button type="button" class="spec-q-option">3. '확인' — 중립적 표현</button><button type="button" class="spec-q-option spec-q-free">✏️ 직접 입력할게요</button></div><div class="spec-q-confirm-row"><button type="button" class="spec-q-confirm-btn">✏️ 수정</button><button type="button" class="spec-q-cancel-btn" style="display:none">취소</button></div><div class="spec-q-actions answered"><button type="button" class="spec-q-action" disabled>⏭ 건너뛰기</button><button type="button" class="spec-q-action" disabled>🚫 스펙아웃</button></div></div><div class="spec-msg spec-msg-user">1. '취소하기' — 파괴적 액션을 명확히</div><div class="spec-msg spec-msg-team-lead" data-section-id="9"><div class="spec-q-meta"><div class="spec-q-ic">📋</div><div class="spec-q-meta-txt"><div class="spec-q-sec">개발 스펙</div><div class="spec-q-prog">질문 1 / 1</div></div></div><div class="spec-q-tag" data-tip="개발 스펙 문서에서 근거를 찾지 못한 항목이에요.">🏷 미정의(빈칸)</div><div class="spec-q-body">취소 요청이 실패했을 때 클라이언트로 내려주는 오류 응답 형식은 무엇인가요?</div><div class="spec-q-options"><button type="button" class="spec-q-option">1. 표준 에러 코드 + 메시지 (code, message)</button><button type="button" class="spec-q-option selected">2. HTTP 상태코드 + 사유 코드 (errorCode)</button><button type="button" class="spec-q-option">3. 성공/실패 불리언 + 사유 문자열</button><button type="button" class="spec-q-option spec-q-free">✏️ 직접 입력할게요</button></div><div class="spec-q-confirm-row"><button type="button" class="spec-q-confirm-btn">✓ 확정</button><button type="button" class="spec-q-cancel-btn" style="display:none">취소</button></div><div class="spec-q-actions"><button type="button" class="spec-q-action">⏭ 건너뛰기</button><button type="button" class="spec-q-action">🚫 스펙아웃</button><div class="spec-q-specout-box" style="display:none"><textarea class="spec-q-specout-input" rows="2" placeholder="이번 범위에서 제외할 내용을 서술형으로 적어 주세요"></textarea><button type="button" class="spec-q-action spec-q-specout-register">등록</button></div></div></div></div><div class="spec-chat-input-row"><textarea class="spec-chat-input" id="spec-chat-input" placeholder="직접 답변을 입력할때만 사용해주세요." rows="2"></textarea><button class="spec-chat-send" id="spec-chat-send">전송</button></div></div></div></div></div></script>

<script type="text/html" id="tpl-e2econfig"><div id="e2e-config-panel"><div class="e2e-form-header"><div><div class="e2e-form-title">E2E 실행 설정</div><div class="e2e-form-subtitle">[예약 취소 플로우 개편] · 확정된 TC를 실제 기기에서 자동 실행</div></div></div><div class="e2e-cfg-body"><div class="form-wrap"><p class="form-intro">아래를 <b>한 단계씩</b> 채워주세요. 완료한 단계는 위에 <b>요약</b>으로 접히고, 언제든 <b>수정</b>할 수 있어요.</p><div class="tcr-notice"><span class="ic">⚠️</span><span class="tx"><b>TC 리뷰로 돌아가면 이번 실행 기록은 지워져요.</b><br>TC 내용을 바꿔 확정하면 Zephyr에 새 사이클이 만들어지고, E2E도 새 테스트로 처음부터 실행합니다.</span></div><div class="fsec stepsec wiz-active" data-step="plat"><div class="ac-step">STEP 1 · 플랫폼</div><div class="ac-q">어떤 플랫폼에서 실행할까요?<span class="req">*</span></div><div class="form-checkbox-group" id="e2e-plat-grp"><label><input type="checkbox" data-p="web" checked> 🌐 웹</label><label><input type="checkbox" data-p="android" checked> 🤖 Android</label><label><input type="checkbox" data-p="ios"> 🍎 iOS</label></div><p class="plat-src">확정된 TC 기준 목록이에요.</p><p class="form-hint">웹 · 모바일을 <b>함께</b> 실행해요.</p><div class="hl-wrap"><div class="form-checkbox-group"><label><input type="checkbox" id="e2e-hl-chk"> 🖥 웹을 백그라운드로 실행 (headless)</label></div><p class="form-hint">켜면 브라우저 창 없이 백그라운드로 실행돼요. <span class="cd">(웹 실행에만 적용)</span></p></div><div class="ac-actions"><button class="ac-next" data-act="next">다음 →</button><span class="ac-enter"><kbd>Enter</kbd> 로 다음</span></div></div><div class="upnext" id="e2e-upnext"><span class="un-n">2</span><span>다음: 실행 환경을 설정해주세요</span></div></div></div><div id="e2e-cfg-foot"><button class="btn-secondary" data-act="prev" style="visibility:hidden">← 이전</button><button class="btn-secondary" data-act="reset">↩ 입력 초기화</button><span class="cfg-guard" id="e2e-cfg-guard"></span></div><div id="e2e-tc-groups" hidden><div class="tc-group"><div class="tc-group-header"><input type="checkbox" class="tc-group-cb" data-g="0" checked><button class="tc-gh-btn" data-g="0"><span class="chev">▼</span><span class="tc-group-t function renderByP(p){
var out='';
var g0 = p>=1?'done':(p===0?'active':'pending');
var g1 = p>=2?'done':(p===1?'active':'pending');
var g2 = p>=3?'done':(p===2?'active':'pending');
var g3done = p>=9;
out += gHead(TCG_GROUPS[0], g0, g0==='done'?'완료':(g0==='active'?'진행 중':'대기'), '▸');
out += gHead(TCG_GROUPS[1], g1, g1==='done'?'완료':(g1==='active'?'진행 중':'대기'), '▸');
out += gHead(TCG_GROUPS[2], g2, g2==='done'?'완료':(g2==='active'?'진행 중':'대기'), '▸');
var subsDone = p<3?0:(g3done?6:(p-3));
var g3state = g3done?'done':(p>=3?'active':'pending');
var g3sub = g3done?'완료':(g3state==='active'?('진행 중 · '+subsDone+'/6'):'대기');
out += gHead(TCG_GROUPS[3], g3state, g3sub, g3state==='pending'?'▸':'▾');
if(g3state!=='pending'){
var subs='';
for(var i=0;i<6;i++){ var st = i<subsDone?'done':(i===subsDone && !g3done?'active':'pending'); subs+=gSub(TCG_SUBS[i], st); }
out += '<div style="margin-left:11px;padding-left:13px;border-left:2px solid var(--border);">'+subs+'</div>';
}
return out;
}

<script>
(function(){
  // [E2E 결과] 탭 전환 — 요약 / 실패 분석 / 전체 TC. 앱과 같이 본문(.md-cols·.ov)만 바꾼다.
  //   show() 가 템플릿을 새로 그리므로 위임(document 레벨)으로 걸어 재바인딩이 필요 없게 한다.
  function applyTab(root, tab){
    var ov = root.querySelector('.ov-pane'), st = root.querySelector('.rstrip'), cols = root.querySelector('.md-cols');
    if(ov) ov.style.display = (tab === 'overview') ? '' : 'none';
    if(st) st.style.display = (tab === 'fails') ? '' : 'none';
    if(cols) cols.style.display = (tab === 'overview') ? 'none' : '';
    // 실패 분석 = 실패·차단만. 전체 TC = 전부. (좌측 목록 행을 직접 걸러 앱 동작과 같은 결과를 만든다)
    if(cols){
      cols.querySelectorAll('.md-row').forEach(function(r){
        var st = r.dataset.status;
        r.style.display = (tab === 'fails' && st !== 'fail' && st !== 'blocked') ? 'none' : '';
      });
      cols.querySelectorAll('.md-grp').forEach(function(g){
        var vis = [].slice.call(g.querySelectorAll('.md-row')).some(function(r){ return r.style.display !== 'none'; });
        g.style.display = (tab === 'fails' && !vis) ? 'none' : '';
      });
      var rt = cols.querySelector('.res-tabs');
      if(rt) rt.style.display = (tab === 'fails') ? 'none' : '';  // 실패 분석엔 상태 탭이 무의미
    }
    root.querySelectorAll('.tabbar .tabbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === tab); });
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('.tabbar .tabbtn');
    if(!b) return;
    var root = b.closest('#test-history-body'); if(!root) return;
    applyTab(root, b.dataset.tab);
  });
  // 화면 진입 시 기본 탭(앱과 동일하게 '요약')
  var mo = new MutationObserver(function(){
    var root = document.querySelector('#test-history-body');
    if(root && !root.dataset.tabInit){ root.dataset.tabInit = '1'; applyTab(root, 'overview'); }
  });
  mo.observe(document.body, { childList:true, subtree:true });
})();
</script>

/* 종이 두 장이 겹친 모양. velog·티스토리에서 쓰는 그 아이콘을 CSS 로만 그린다.
   ⚠️ SVG data URI 는 예전에 이 아티팩트의 공유를 막은 원인이라 쓰지 않는다. */

<script>
(function(){
  // 아티팩트는 iframe 안에서 뜬다. clipboard 권한이 막히는 경우가 있어 옛 방식으로 한 번 더 시도한다.
  function legacyCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(_) {}
    document.body.removeChild(ta);
    return ok;
  }
  // 둘 다 막히면 최소한 글자를 잡아준다 - 그 상태로 Cmd+C 하면 된다.
  function selectAll(box){
    try {
      var r = document.createRange(); r.selectNodeContents(box.querySelector('code'));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      return true;
    } catch(_) { return false; }
  }
  function flash(btn, ok, box){
    if (!ok) selectAll(box);
    btn.classList.toggle('ok', ok);
    btn.classList.toggle('warn', !ok);
    btn.setAttribute('title', ok ? '복사했어요' : '글자를 잡아뒀어요. ⌘C 를 누르세요');
    setTimeout(function(){
      btn.classList.remove('ok'); btn.classList.remove('warn');
      btn.setAttribute('title', '복사');
    }, ok ? 1400 : 2800);
  }
  function copy(text, btn, box){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function(){ flash(btn, true, box); },
        function(){ flash(btn, legacyCopy(text), box); });
    } else {
      flash(btn, legacyCopy(text), box);
    }
  }
  var boxes = document.querySelectorAll('.insg-code[data-copy]');
  for (var i = 0; i < boxes.length; i++) {
    (function(box){
      var wrap = document.createElement('div');
      wrap.className = 'insg-cw';
      box.parentNode.insertBefore(wrap, box);
      wrap.appendChild(box);
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'insg-cp';
      btn.setAttribute('aria-label', '복사하기');
      btn.setAttribute('title', '복사');
      btn.appendChild(document.createElement('i'));           // 아이콘(CSS 로 그림)
      var lbl = document.createElement('span');               // 클립보드가 막혔을 때만 보인다
      lbl.className = 'insg-cp-t'; lbl.textContent = '⌘C 로 복사';
      btn.appendChild(lbl);
      btn.addEventListener('click', function(){
        copy(box.querySelector('code').textContent, btn, box);
      });
      wrap.appendChild(btn);
    })(boxes[i]);
  }
})();
</script>
<style>

<script>
(function(){
  var g = document.getElementById('install-guide');
  var inner = g && g.querySelector('.insg-inner');
  var header = inner && inner.querySelector('header');
  if (!header) return;

  // 제목에서 번호·소요시간 같은 곁다리 배지를 떼고 글자만 남긴다.
  function label(node, drop){
    var c = node.cloneNode(true);
    drop.forEach(function(sel){
      var el = c.querySelectorAll(sel);
      for (var i = 0; i < el.length; i++) el[i].parentNode.removeChild(el[i]);
    });
    return c.textContent.replace(/\s+/g, ' ').trim();
  }

  var nav = document.createElement('nav');
  nav.className = 'insg-toc';
  nav.setAttribute('aria-label', '목차');
  nav.innerHTML = '<div class="insg-toc-h">목차</div>';
  var list = document.createElement('ul');
  nav.appendChild(list);

  var links = [], targets = [];
  function row(parent, el, text, num, lv){
    var li = document.createElement('li');
    if (lv === 2) li.className = 'lv2';
    var a = document.createElement('a');
    a.innerHTML = '<span class="insg-toc-n"></span><span></span>';
    a.firstChild.textContent = num || '';
    a.lastChild.textContent = text;
    a.addEventListener('click', function(e){
      e.preventDefault();
      // 가이드는 자체 스크롤 상자다 - 페이지가 아니라 이 상자를 움직여야 한다.
      var top = g.scrollTop + el.getBoundingClientRect().top - g.getBoundingClientRect().top - 14;
      try { g.scrollTo({ top: top, behavior: 'smooth' }); } catch(_) { g.scrollTop = top; }
    });
    li.appendChild(a); parent.appendChild(li);
    links.push(a); targets.push(el);
  }

  var secs = inner.querySelectorAll('section.insg-sec');
  for (var i = 0; i < secs.length; i++) {
    var sec = secs[i], h = sec.querySelector('.insg-h');
    if (!h) continue;
    // 제목과 그 하위를 한 묶음으로 - 단이 나뉠 때 사이가 끊기면 읽기 어렵다.
    var grp = document.createElement('li');
    grp.className = 'grp';
    var sub = document.createElement('ul');
    grp.appendChild(sub); list.appendChild(grp);

    var n = h.querySelector('.insg-n');
    row(sub, sec, label(h, ['.insg-n', '.insg-time']), n ? n.textContent.trim() + '.' : '', 1);
    var sts = sec.querySelectorAll('.insg-st');
    for (var j = 0; j < sts.length; j++) {
      row(sub, sts[j], label(sts[j], ['.insg-once', '.insg-opt']), '', 2);
    }
  }
  if (!links.length) return;
  header.parentNode.insertBefore(nav, header.nextSibling);

  // 지금 읽고 있는 곳을 짚어준다.
  var tick = null;
  function sync(){
    tick = null;
    var gt = g.getBoundingClientRect().top, cur = 0;
    for (var i = 0; i < targets.length; i++) {
      if (targets[i].getBoundingClientRect().top - gt <= 60) cur = i; else break;
    }
    for (var k = 0; k < links.length; k++) links[k].classList.toggle('on', k === cur);
  }
  g.addEventListener('scroll', function(){ if (!tick) tick = requestAnimationFrame(sync); });
  sync();
})();
</script>

<script>
(function(){
  // tc → { title, vers:[{ord, icon, label, time, score}], cur }
  //   cur = '지금 이 TC 에 반영돼 있는 버전'의 ord. 되돌리기는 cur 만 옮긴다(새 버전 안 생김).
  var H = {};

  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n<10?'0':'')+n; }
  function stamp(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function toast(m){ try{ var t=document.getElementById('demo-toast');
    if(!t){ t=document.createElement('div'); t.id='demo-toast'; t.className='demo-toast';
      document.getElementById('demo-root').appendChild(t); }
    t.textContent=m; t.classList.add('on'); clearTimeout(t._t);
    t._t=setTimeout(function(){ t.classList.remove('on'); },2200);
  }catch(_){} }

  function tabTo(key){
    var tabs=document.querySelectorAll('#cli-side-content .rtab');
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('on', tabs[i].dataset.rtab===key);
    var c=$('rb-check'), s=$('rb-hist');
    if(c) c.classList.toggle('rb-off', key!=='check');
    if(s) s.classList.toggle('rb-off', key!=='hist');
  }

  function verRow(tc, v, isCur){
    var row=document.createElement('div');
    row.className='htl-row'+(isCur?' cur':'');
    row.innerHTML='<span class="htl-dot'+(isCur?' cur':'')+'"></span>'
      + '<span class="htl-v">v'+v.ord+'</span>'
      + '<span class="htl-src"></span>'
      + '<span class="htl-score"></span>'
      + '<span class="htl-time">'+v.time+'</span>';
    row.querySelector('.htl-src').textContent = v.icon+' '+v.label;
    row.querySelector('.htl-score').textContent = v.score!=null ? (v.score+'점') : '';
    var act;
    if(isCur){ act=document.createElement('span'); act.className='cur-tag'; act.textContent='현재'; }
    else{
      act=document.createElement('button'); act.className='vrb'; act.type='button';
      act.textContent='↩ 되돌리기';
      act.setAttribute('data-tip','v'+v.ord+' 내용으로 되돌립니다\n(새 버전은 안 생겨요 — 언제든 다시 되돌릴 수 있어요)');
      act.addEventListener('click', function(e){
        e.stopPropagation();
        H[tc].cur = v.ord;                 // 새 버전을 만들지 않는다 - 앱 툴팁 그대로.
        render(); toast('↩ v'+v.ord+' 내용으로 되돌렸어요 — 다시 최신으로 되돌릴 수 있어요');
      });
    }
    row.insertBefore(act, row.querySelector('.htl-time'));
    return row;
  }

  function render(){
    var empty=$('hist-empty'), body=$('hist-body'), list=$('hist-list'), filt=$('hist-filt');
    if(!list) return;
    var keys=Object.keys(H);
    if(!keys.length){ if(empty) empty.classList.remove('rb-off'); if(body) body.classList.add('rb-off'); return; }
    if(empty) empty.classList.add('rb-off');
    if(body) body.classList.remove('rb-off');

    var total=0; for(var i=0;i<keys.length;i++) total+=H[keys[i]].vers.length;
    filt.textContent='';
    [['전체', total], ['완료', total]].forEach(function(p,i){
      var b=document.createElement('button'); b.type='button';
      b.className='hfseg'+(i===0?' on':''); b.textContent=p[0]+' '+p[1];
      b.addEventListener('click', function(){
        var segs=filt.querySelectorAll('.hfseg');
        for(var j=0;j<segs.length;j++) segs[j].classList.toggle('on', segs[j]===b);
      });
      filt.appendChild(b);
    });

    list.textContent='';
    keys.forEach(function(tc){
      var g=H[tc];
      var box=document.createElement('div');
      box.className='hgrp'+(g.open===false?'':' open');
      var head=document.createElement('div'); head.className='hgrp-h';
      head.innerHTML='<span class="hcaret">▸</span><span class="hgtitle"></span>'
        + '<span class="hv">v'+g.vers.length+'</span><span class="hstat done">완료</span>';
      head.querySelector('.hgtitle').textContent=g.title;
      head.addEventListener('click', function(){ g.open = !(g.open!==false); render(); });
      box.appendChild(head);
      var tl=document.createElement('div'); tl.className='htl';
      for(var i=g.vers.length-1;i>=0;i--) tl.appendChild(verRow(tc, g.vers[i], g.vers[i].ord===g.cur));
      box.appendChild(tl);
      list.appendChild(box);
    });
  }

  function add(icon, label, score){
    var idEl=document.querySelector('#tc-edit-modal-root .m-id');
    var titleEl=document.querySelector('#tc-edit-modal-root .m-in');
    var tc=idEl?idEl.textContent.trim():'TC';
    var title=(titleEl&&(titleEl.value||titleEl.placeholder))||tc;
    if(!H[tc]){
      // 처음 손대는 TC 는 '생성' 버전부터 쌓아야 되돌릴 지점이 생긴다(앱도 v1 이 생성 커밋).
      H[tc]={ title:title, cur:1, vers:[{ord:1, icon:'🆕', label:'생성', time:'어제', score:62}] };
    }
    var g=H[tc]; g.title=title;
    var ord=g.vers.length+1;
    g.vers.push({ord:ord, icon:icon, label:label, time:stamp(), score:score});
    g.cur=ord; g.open=true;
    render(); tabTo('hist');
  }

  // 캡처 단계에서 받는다 — 목업의 저장 핸들러가 먼저 돌면 팝업이 닫혀 TC 번호를 못 읽는다(실측: 제목이 'TC' 로 떨어짐).
  document.addEventListener('click', function(e){
    var t=e.target;
    if(!t||!t.closest) return;
    var tab=t.closest('#cli-side-content .rtab');
    if(tab){ tabTo(tab.dataset.rtab); return; }
    // 저장 두 갈래 — 누른 버튼이 곧 이력의 종류다(앱 VSRC 라벨).
    //   [스텝만 진행] 은 목업에 원래 없던 버튼이라 닫는 주인이 없다. 여기서 닫는다.
    //   (AI 쪽은 목업의 saveEditModal 이 알아서 닫으므로 건드리지 않는다.)
    if(t.closest('.m-save-steps')){
      add('✎','직접 수정', 78);
      var root=document.getElementById('tc-edit-modal-root');
      if(root && root.parentNode) root.parentNode.removeChild(root);
      toast('✎ 수정한 내용을 저장했어요 — 오른쪽 수정 이력에 남았어요');
      return;
    }
    if(t.closest('.m-save')){ add('🤖','AI 보완', 91); return; }
  }, true);
})();
</script>
<script>
(function(){
  function go(k){
    var b = document.querySelector('#demo-bar .demo-seg [data-s="' + k + '"]');
    if (!b) return;
    b.click();
    // specchat 버튼은 숨어 있어 눌린 티가 안 난다. 보이는 탭(① AI 인터뷰)에 표시를 남긴다.
    //   (숨은 버튼이 DOM 상 먼저라, 화면 안내는 계속 specchat 을 현재 화면으로 읽는다.)
    if (k === 'specchat') {
      var sb = document.querySelector('#demo-bar .demo-seg [data-s="spec"]');
      if (sb) sb.classList.add('on');
    }
  }
  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest('#spec-form-start')) {            // 새 프로젝트 → 시작 전 안내
      e.stopPropagation(); go('spec'); return;
    }
    if (t.closest('.si-start')) {                   // 시작 전 안내 → AI 인터뷰
      e.stopPropagation(); go('specchat'); return;
    }
  }, true);

  // 확인 체크 전에는 시작 못 한다(앱 app.js:736 과 같은 게이트).
  document.addEventListener('change', function(e){
    var cb = e.target;
    if (!cb || !cb.classList || !cb.classList.contains('si-ack-cb')) return;
    var root = cb.closest('.stage-intro');
    var start = root && root.querySelector('.si-start');
    if (start) start.disabled = !cb.checked;
  });
})();
</script>
